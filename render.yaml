services:
  - type: web
    name: jimmy
    runtime: static
    # A static site: nothing to build. Plain shell only, so the build never depends on Python being there;
    # run `python site/check_site.py` locally before pushing site changes.
    buildCommand: 'test -f site/index.html && test -f site/icon.png && echo "static site, nothing to build"'
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
