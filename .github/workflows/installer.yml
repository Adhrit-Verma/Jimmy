# D61: build Jimmy-Setup.exe on one fresh Windows VM, then install and test it on another.
# The test VM is an independent system: it has never seen this repo's .venv, Node modules,
# CUDA toolkit or data. Python, Node and CUDA are taken off PATH before anything runs, so
# Jimmy must bring everything it needs itself.
name: installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["installer/**", "overlay/**", "ambient/**", "jimmy/**", "requirements.txt", ".github/workflows/installer.yml"]

jobs:
  # D68: no build, and so no release, with a failing suite.
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: python -m pip install -r requirements.txt
      - run: python tests/run_all.py

  build:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Tools for the build
        run: python -m pip install pillow
      - name: Overlay packages
        working-directory: overlay
        run: npm ci
      - name: Build the installer
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
        run: python installer/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: jimmy-setup
          path: |
            installer/out/Jimmy-Setup-*.exe
            installer/out/Jimmy-Setup-*.exe.sha256
          retention-days: 14

  test-clean-machine:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with: { name: jimmy-setup, path: setup }
      - name: Install, set up, run, uninstall (dev tools hidden)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # An independent system: nothing of the runner's Python, Node or CUDA on PATH.
          $env:PATH = "C:\Windows\system32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Program Files\PowerShell\7"
          foreach ($v in 'CUDA_PATH','PYTHONHOME','PYTHONPATH','VIRTUAL_ENV','pythonLocation','NODE_PATH') { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          $setup = (Get-ChildItem setup\Jimmy-Setup-*.exe | Select-Object -First 1).FullName
          $want = (Get-Content (Get-ChildItem setup\*.sha256 | Select-Object -First 1)).Split(' ')[0]
          $got = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "setup.exe doesn't match its SHA-256" }
          "setup: $setup ($([math]::Round((Get-Item $setup).Length/1MB)) MB), sha256 ok"

          # 1. install per user, to D: (not C:), silently
          $p = Start-Process $setup -ArgumentList '/S','/D=D:\Apps\Jimmy' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install exit $($p.ExitCode)" }
          if (-not (Test-Path D:\Apps\Jimmy\Jimmy.exe)) { throw "Jimmy.exe not installed" }
          "installed: $((Get-ChildItem D:\Apps\Jimmy -Recurse | Measure-Object Length -Sum).Sum/1MB) MB on D:"
          # runAfterFinish may start Jimmy after a silent install; its onboarding would hold the
          # single-instance lock the headless runs below need.
          Start-Sleep 5
          $running = Get-Process Jimmy -ErrorAction SilentlyContinue
          "Jimmy running after install: $(@($running).Count) process(es)"
          $running | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 2

          # 2. first run, headless: Jimmy's own Python, packages, the speech model (Lite, CPU)
          $t = Get-Date
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $p = Start-Process D:\Apps\Jimmy\Jimmy.exe -ArgumentList '--provision','--data','D:\JimmyData','--profile','lite','--gpu','0','--log','D:\provision.log' -Wait -PassThru -RedirectStandardOutput D:\provision.out -RedirectStandardError D:\provision.err
          "provision: exit $($p.ExitCode) in $([int]((Get-Date)-$t).TotalSeconds) s"
          Get-Content D:\provision.log -ErrorAction SilentlyContinue | Select-String '\] (done|failed)|vcrtFrom|verify.*✗|FAILED|^\S+ provision:|headless' | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0 -or -not (Test-Path D:\JimmyData\runtime\ready.json)) {
            "--- provision.log"; Get-Content D:\provision.log -Tail 60 -ErrorAction SilentlyContinue
            "--- Electron's stderr"; Get-Content D:\provision.err -Tail 40 -ErrorAction SilentlyContinue
            "--- Electron's stdout"; Get-Content D:\provision.out -Tail 20 -ErrorAction SilentlyContinue
            throw "provision didn't finish (exit $($p.ExitCode), no ready.json)"
          }

          # 3. self-test: every native piece imports, doctor runs, Jimmy runs 20 s
          $p = Start-Process D:\Apps\Jimmy\Jimmy.exe -ArgumentList '--self-test','--log','D:\selftest.log' -Wait -PassThru -RedirectStandardOutput D:\selftest.out -RedirectStandardError D:\selftest.err
          Get-Content D:\selftest.log -ErrorAction SilentlyContinue | Select-String 'self-test|"ok": false|msvcp140|cuda|ok  |FAIL' | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0 -or -not (Test-Path D:\selftest.log)) { Get-Content D:\selftest.log -Tail 80 -ErrorAction SilentlyContinue; Get-Content D:\selftest.err -Tail 40 -ErrorAction SilentlyContinue; throw "self-test failed (exit $($p.ExitCode))" }
          $vc = Select-String -Path D:\selftest.log -Pattern '"dll": "msvcp140.dll", "path": "([^"]+)"' | Select-Object -First 1
          # The path comes from a JSON line: its backslashes are doubled.
          $vcPath = if ($vc) { $vc.Matches[0].Groups[1].Value.Replace('\\', '\') } else { "" }
          "C++ runtime loaded from: $vcPath"
          if (-not $vcPath -or $vcPath -notlike 'D:\JimmyData\runtime\*') { throw "msvcp140 came from outside Jimmy's own Python ($vcPath)" }

          # 3b. an update over the top keeps the setup (Jimmy's Python, the pointer, the data)
          $p = Start-Process $setup -ArgumentList '/S','/D=D:\Apps\Jimmy' -Wait -PassThru
          "update: exit $($p.ExitCode); runtime kept: $(Test-Path D:\JimmyData\runtime\ready.json); pointer kept: $(Test-Path $env:APPDATA\Jimmy\location.json)"
          if (-not (Test-Path D:\JimmyData\runtime\ready.json) -or -not (Test-Path $env:APPDATA\Jimmy\location.json)) { throw "an update undid the setup" }

          # 3c. self-update (D64): a downloaded, verified update installs when Jimmy.exe starts,
          # and the setup starts Jimmy again. The same setup stands in for a newer one.
          $up = 'D:\JimmyData\cache\update'
          New-Item -ItemType Directory -Force $up | Out-Null
          Copy-Item $setup "$up\Jimmy-Setup-999.0.0.exe"
          $sha = (Get-FileHash "$up\Jimmy-Setup-999.0.0.exe" -Algorithm SHA256).Hash.ToLower()
          @{ version = '999.0.0'; file = "$up\Jimmy-Setup-999.0.0.exe"; sha256 = $sha } | ConvertTo-Json | Set-Content -Encoding ascii "$up\pending.json"
          Set-Content D:\Apps\Jimmy\marker.txt 'gone if the setup ran'
          Start-Process D:\Apps\Jimmy\Jimmy.exe
          $deadline = (Get-Date).AddSeconds(180)
          # Done when the setup ran and Jimmy's Python runs again (the update folder may still hold
          # the setup, in use for a moment, and is cleared at a later check).
          do { Start-Sleep 3; $py = @(Get-Process | Where-Object { $_.Path -like 'D:\JimmyData\runtime\*' }).Count } until (((-not (Test-Path D:\Apps\Jimmy\marker.txt)) -and (Test-Path D:\Apps\Jimmy\Jimmy.exe) -and $py -gt 0) -or (Get-Date) -gt $deadline)
          $tried = (Test-Path "$up\pending.json") -and ((Get-Content "$up\pending.json" -Raw) -match '"tried":true')
          "self-update: setup ran: $(-not (Test-Path D:\Apps\Jimmy\marker.txt)); Jimmy.exe back: $(Test-Path D:\Apps\Jimmy\Jimmy.exe); update left: $(Test-Path $up) (tried: $tried); Jimmy's Python running: $py"
          Get-Content D:\Apps\Jimmy\setup.log -Tail 5 -ErrorAction SilentlyContinue
          if (Test-Path D:\Apps\Jimmy\marker.txt) { throw "the update's setup never ran" }
          if ($py -eq 0) { throw "Jimmy didn't start again after the update" }
          if ((Test-Path "$up\pending.json") -and -not $tried) { throw "the update would be installed again at the next start" }
          Get-Process | Where-Object { $_.Path -like 'D:\Apps\Jimmy\*' -or $_.Path -like 'D:\JimmyData\runtime\*' } | Stop-Process -Force
          Start-Sleep 3

          # 4. what landed on C:
          "on C: (APPDATA\Jimmy):"; Get-ChildItem "$env:APPDATA\Jimmy" | ForEach-Object { "  $($_.Name) $($_.Length) B" }
          $c = (Get-ChildItem "$env:APPDATA\Jimmy" -Recurse -File | Measure-Object Length -Sum).Sum
          if ($c -gt 64KB) { throw "more than 64 KB on C: in APPDATA\Jimmy ($c B)" }
          foreach ($d in "$env:LOCALAPPDATA\Jimmy", "$env:USERPROFILE\.cache\huggingface", "$env:USERPROFILE\.ollama") {
            if (Test-Path $d) { "found on C: $d ($((Get-ChildItem $d -Recurse -File | Measure-Object Length -Sum).Sum/1MB) MB)" }
          }
          "data on D: $([math]::Round((Get-ChildItem D:\JimmyData -Recurse -File | Measure-Object Length -Sum).Sum/1MB)) MB, runtime $([math]::Round((Get-ChildItem D:\JimmyData\runtime -Recurse -File | Measure-Object Length -Sum).Sum/1MB)) MB"

          # 5. uninstall silently: the app goes, the data stays (a silent uninstall never deletes it)
          $p = Start-Process 'D:\Apps\Jimmy\Uninstall Jimmy.exe' -ArgumentList '/S' -Wait -PassThru
          Start-Sleep 8
          "uninstall exit $($p.ExitCode); app folder left: $(Test-Path D:\Apps\Jimmy\Jimmy.exe); runtime left: $(Test-Path D:\JimmyData\runtime); data kept: $(Test-Path D:\JimmyData\settings.json); C: pointer left: $(Test-Path $env:APPDATA\Jimmy)"
          if (Test-Path D:\Apps\Jimmy\Jimmy.exe) { throw "uninstall left Jimmy.exe" }
          if (Test-Path "$env:APPDATA\Jimmy") { throw "uninstall left APPDATA\Jimmy" }
          if (Test-Path D:\JimmyData\runtime) { throw "uninstall left Jimmy's Python" }
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          foreach ($f in 'D:\provision.log','D:\provision.out','D:\provision.err','D:\selftest.log','D:\selftest.out','D:\selftest.err','D:\JimmyData\logs\jimmy.log','D:\Apps\Jimmy\setup.log') {
            if (Test-Path $f) { Copy-Item $f logs\ }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-machine-logs
          path: logs/
          retention-days: 14

  # D64: a new version in overlay/package.json, pushed to main and passing the clean-machine
  # test, becomes a GitHub Release; installed copies pick it up on their own. Any other push
  # releases nothing (that version already has its release).
  release:
    needs: [build, test-clean-machine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: jimmy-setup, path: setup }
      - name: Publish the release, if this version is new
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v=$(node -p "require('./overlay/package.json').version")
          if gh release view "v$v" > /dev/null 2>&1; then echo "v$v is already released: nothing to do"; exit 0; fi
          exe="setup/Jimmy-Setup-$v.exe"
          test -f "$exe" && test -f "$exe.sha256" || { echo "no $exe in the build"; exit 1; }
          (cd setup && sha256sum -c "Jimmy-Setup-$v.exe.sha256")
          gh release create "v$v" "$exe" "$exe.sha256" --target "$GITHUB_SHA" --title "Jimmy $v" --generate-notes
